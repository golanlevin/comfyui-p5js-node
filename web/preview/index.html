<!DOCTYPE html>
<html lang="en">
  <head>
    <script
      src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.js"
      crossorigin=""
    ></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #222;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script type="text/javascript">
      (function () {
        var P5JS_MESSAGE_SOURCE = "comfyui-p5js-node";
        var originalConsole = {};

        /*
         * Preview iframe runtime
         * ----------------------
         * This page is loaded inside the ComfyUI node's iframe. It receives the
         * sketch filename in the query string, fetches that file from ComfyUI's
         * temp/p5js folder as text, runs the sketch with p5.js 2.3.4, and sends
         * console output / canvas captures back to the parent node via
         * postMessage().
         *
         * Why this is more complex than a normal p5.js page:
         * - RunComfy/ComfyUI's /view endpoint can serve uploaded .js files with
         *   application/octet-stream, so Chrome refuses direct <script src>.
         *   Fetching text and evaluating it locally avoids strict MIME errors.
         * - Classroom sketches are usually global-mode p5 sketches. p5.js 2.x
         *   is happier when we create an explicit instance, so global-mode code
         *   is executed inside a Proxy-backed wrapper that maps p5 functions
         *   like createCanvas(), background(), and line() onto the instance.
         * - Students may paste instance-mode sketches too. The loader detects
         *   common instance-mode forms and avoids wrapping them unnecessarily.
         * - p5.js can create a default 100x100 canvas before user setup() runs.
         *   We remove old/default canvases and wait for setup()/draw() readiness
         *   before capture so ComfyUI receives the student's actual image.
         */

        /**
         * Display a fatal preview error inside the iframe and mirror it to the
         * browser console.
         *
         * @param {string} message User-visible error text.
         * @param {Error | unknown} [error] Original thrown value.
         */
        function showError(message, error) {
          console.error("[p5js preview]", message, error || "");
          document.body.textContent = message;
          document.body.style.cssText =
            "margin: 0; padding: 12px; box-sizing: border-box;" +
            "background: #221b1b; color: #ffd7d7;" +
            "font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;" +
            "white-space: pre-wrap;";
        }

        /**
         * Convert any console argument into text suitable for postMessage.
         *
         * @param {unknown} value Console argument.
         * @returns {string} Printable representation.
         */
        function formatConsoleArg(value) {
          if (value instanceof Error) {
            return value.stack || value.message;
          }
          if (typeof value === "string") {
            return value;
          }
          try {
            return JSON.stringify(value);
          } catch (error) {
            return String(value);
          }
        }

        /**
         * Send one console/status message to the parent node.
         *
         * @param {string} level Console level.
         * @param {IArguments | Array<unknown>} args Console arguments.
         */
        function postConsoleMessage(level, args) {
          var values = Array.prototype.slice.call(args).map(formatConsoleArg);
          window.parent.postMessage(
            {
              source: P5JS_MESSAGE_SOURCE,
              type: "console",
              level: level,
              message: values.join(" "),
              values: values,
              timestamp: Date.now(),
            },
            "*",
          );
        }

        /**
         * Convenience wrapper for iframe runtime status messages.
         *
         * @param {...unknown} arguments Status message parts.
         */
        function postStatus() {
          postConsoleMessage("info", arguments);
        }

        /**
         * Patch console methods so p5 console output appears in the node pane.
         */
        function installConsoleBridge() {
          ["debug", "info", "log", "warn", "error"].forEach(function (level) {
            if (!originalConsole[level]) {
              originalConsole[level] = console[level]?.bind(console) || function () {};
            }
            console[level] = function () {
              postConsoleMessage(level, arguments);
              originalConsole[level].apply(console, arguments);
            };
          });
        }

        /**
         * Replace window.print() with a console bridge.
         *
         * p5.js aliases print() to console logging, but installing this early
         * keeps print() useful from student sketches and from p5 internals.
         */
        function installPrintBridge() {
          window.print = function () {
            postConsoleMessage("log", arguments);
            originalConsole.log.apply(console, arguments);
          };
          window.__p5jsNodePrintBridge = window.print;
        }

        /**
         * Locate the current p5 canvas in the iframe document.
         *
         * @returns {HTMLCanvasElement | null} p5 canvas or first canvas.
         */
        function findCanvas() {
          return document.getElementById("defaultCanvas0") ||
            document.querySelector("canvas");
        }

        /**
         * Remove any existing/default canvases before starting a new sketch.
         */
        function removeExistingCanvases() {
          document.querySelectorAll("canvas").forEach(function (canvas) {
            canvas.remove();
          });
        }

        /**
         * Compute the pixel size that should be exported.
         *
         * @param {HTMLCanvasElement} canvas Canvas to capture.
         * @returns {{width: number, height: number}} Export dimensions.
         */
        function getCanvasExportSize(canvas) {
          var width = Math.round(canvas.clientWidth || canvas.width);
          var height = Math.round(canvas.clientHeight || canvas.height);
          return {
            width: Math.max(1, width),
            height: Math.max(1, height),
          };
        }

        /**
         * Encode a canvas as PNG data.
         *
         * @param {HTMLCanvasElement} canvas Canvas to encode.
         * @returns {Promise<{blob: Blob, width: number, height: number}>}
         *   PNG blob and capture size.
         */
        function canvasToPngBlob(canvas) {
          var size = getCanvasExportSize(canvas);
          var exportCanvas = canvas;

          if (canvas.width !== size.width || canvas.height !== size.height) {
            exportCanvas = document.createElement("canvas");
            exportCanvas.width = size.width;
            exportCanvas.height = size.height;
            var ctx = exportCanvas.getContext("2d");
            ctx.drawImage(canvas, 0, 0, size.width, size.height);
          }

          return new Promise(function (resolve, reject) {
            exportCanvas.toBlob(function (blob) {
              if (blob) {
                resolve({
                  blob: blob,
                  width: size.width,
                  height: size.height,
                });
              } else {
                reject(new Error("Could not capture p5.js canvas."));
              }
            }, "image/png");
          });
        }

        /**
         * Wait until a real sketch canvas exists and the sketch is ready.
         *
         * The readiness flags are set by wrapped setup()/draw() functions. The
         * short settled fallback prevents a sketch without setup()/draw() from
         * waiting forever.
         *
         * @param {number} timeoutMs Maximum wait time.
         * @returns {Promise<HTMLCanvasElement | null>} Canvas or null.
         */
        function waitForCanvas(timeoutMs) {
          var start = Date.now();
          return new Promise(function (resolve) {
            /**
             * Poll once for a usable canvas, then reschedule if needed.
             */
            function check() {
              var canvas = findCanvas();
              var startedAt = window.__p5jsSketchStartedAt || start;
              var hasSettled = Date.now() - startedAt > 750;
              if (
                canvas &&
                canvas.width > 0 &&
                canvas.height > 0 &&
                (window.__p5jsSketchReady || hasSettled)
              ) {
                resolve(canvas);
                return;
              }
              if (Date.now() - start >= timeoutMs) {
                resolve(null);
                return;
              }
              setTimeout(check, 50);
            }
            check();
          });
        }

        /**
         * Build a function that runs global-mode sketch source against a p5
         * instance.
         *
         * The Proxy makes calls like createCanvas(512, 512) resolve to p's
         * methods while still preserving local variables declared by the
         * student's sketch.
         *
         * @param {string} source Student sketch source.
         * @param {string} sketchName Filename used for browser source maps.
         * @returns {Function} Function that installs setup/draw/events on p.
         */
        function createSketchFactory(source, sketchName) {
          var eventNames = [
            "preload",
            "setup",
            "draw",
            "mousePressed",
            "mouseReleased",
            "mouseClicked",
            "doubleClicked",
            "mouseMoved",
            "mouseDragged",
            "mouseWheel",
            "keyPressed",
            "keyReleased",
            "keyTyped",
            "touchStarted",
            "touchMoved",
            "touchEnded",
            "windowResized",
            "deviceMoved",
            "deviceTurned",
            "deviceShaken",
          ];

          return new Function(
            "p",
            "window",
            "document",
            "console",
            "print",
            [
              "var __p5Exports = {};",
              "var __p5Api = new Proxy({",
              "  console: console,",
              "  print: print,",
              "  window: window,",
              "  document: document,",
              "}, {",
              "  has: function(target, key) {",
              "    return key in target || key in p;",
              "  },",
              "  get: function(target, key) {",
              "    if (key in target) return target[key];",
              "    var value = p[key];",
              "    return typeof value === 'function' ? value.bind(p) : value;",
              "  },",
              "  set: function(target, key, value) {",
              "    target[key] = value;",
              "    return true;",
              "  }",
              "});",
              "with (__p5Api) {",
              source,
              eventNames.map(function (name) {
                return (
                  "if (typeof " +
                  name +
                  " === 'function') __p5Exports." +
                  name +
                  " = " +
                  name +
                  ";"
                );
              }).join("\n"),
              "}",
              "Object.keys(__p5Exports).forEach(function (name) {",
              "  p[name] = __p5Exports[name];",
              "});",
              "if (__p5Exports.setup) {",
              "  var __p5UserSetup = p.setup;",
              "  p.setup = function () {",
              "    var result = __p5UserSetup.apply(this, arguments);",
              "    window.__p5jsSketchReady = true;",
              "    return result;",
              "  };",
              "} else {",
              "  window.__p5jsSketchReady = true;",
              "}",
              "if (__p5Exports.draw) {",
              "  var __p5UserDraw = p.draw;",
              "  p.draw = function () {",
              "    window.__p5jsSketchReady = true;",
              "    return __p5UserDraw.apply(this, arguments);",
              "  };",
              "}",
              "\n//# sourceURL=/p5js/" + sketchName,
            ].join("\n"),
          );
        }

        /**
         * Mark the beginning of a sketch run for readiness/capture timing.
         */
        function markSketchStarting() {
          window.__p5jsSketchReady = false;
          window.__p5jsSketchStartedAt = Date.now();
        }

        /**
         * Wrap an instance-mode factory so setup()/draw() update readiness.
         *
         * @param {(p: object) => void} factory User-provided p5 instance factory.
         * @returns {(p: object) => void} Wrapped p5 instance factory.
         */
        function wrapInstanceFactory(factory) {
          return function (p) {
            factory(p);

            if (typeof p.setup === "function") {
              var userSetup = p.setup;
              p.setup = function () {
                var result = userSetup.apply(this, arguments);
                window.__p5jsSketchReady = true;
                return result;
              };
            }

            if (typeof p.draw === "function") {
              var userDraw = p.draw;
              p.draw = function () {
                window.__p5jsSketchReady = true;
                return userDraw.apply(this, arguments);
              };
            }

            if (typeof p.setup !== "function") {
              window.__p5jsSketchReady = true;
            }
          };
        }

        /**
         * Detect and prepare common p5 instance-mode sketch forms.
         *
         * Supported forms include direct new p5(...), module.exports = fn,
         * export default fn, const sketch = fn, and function sketch(p) {...}.
         *
         * @param {string} source Student sketch source.
         * @param {string} sketchName Filename used for browser source maps.
         * @returns {{started?: boolean, factory?: Function} | null}
         *   Direct sketches are already started; factory sketches are returned.
         */
        function getInstanceModeSketch(source, sketchName) {
          var trimmed = source.trim();

          if (
            /^new\s+p5\s*\(/.test(trimmed) ||
            /[;\n]\s*new\s+p5\s*\(/.test(trimmed)
          ) {
            markSketchStarting();
            postStatus("Running direct instance-mode p5 sketch.");
            new Function(
              "window",
              "document",
              "console",
              "print",
              "p5",
              [
                trimmed,
                "return true;",
                "\n//# sourceURL=/p5js/" + sketchName,
              ].join("\n"),
            )(window, document, console, window.print, window.p5);
            return { started: true };
          }

          var expressionMatch =
            trimmed.match(/^module\.exports\s*=\s*([\s\S]+?)\s*;?$/) ||
            trimmed.match(/^export\s+default\s+([\s\S]+?)\s*;?$/) ||
            trimmed.match(/^(?:const|let|var)\s+\w+\s*=\s*([\s\S]+?)\s*;?$/);

          if (expressionMatch) {
            postStatus("Running factory-style instance-mode p5 sketch.");
            return {
              factory: new Function(
                "window",
                "document",
                "console",
                "print",
                "p5",
                [
                  "var __factory = (" + expressionMatch[1] + ");",
                  "if (typeof __factory !== 'function') {",
                  "  throw new Error('Instance-mode p5 sketch did not evaluate to a function.');",
                  "}",
                  "return __factory;",
                  "\n//# sourceURL=/p5js/" + sketchName,
                ].join("\n"),
              )(window, document, console, window.print, window.p5),
            };
          }

          var namedFunctionMatch = trimmed.match(
            /^function\s+(\w+)\s*\([^)]*\)\s*\{[\s\S]*\}\s*;?$/,
          );
          if (
            namedFunctionMatch &&
            !/^(setup|draw|preload)$/.test(namedFunctionMatch[1])
          ) {
            postStatus("Running named instance-mode p5 sketch.");
            return {
              factory: new Function(
                "window",
                "document",
                "console",
                "print",
                "p5",
                [
                  trimmed,
                  "if (typeof " + namedFunctionMatch[1] + " !== 'function') {",
                  "  throw new Error('Instance-mode p5 sketch did not define a function.');",
                  "}",
                  "return " + namedFunctionMatch[1] + ";",
                  "\n//# sourceURL=/p5js/" + sketchName,
                ].join("\n"),
              )(window, document, console, window.print, window.p5),
            };
          }

          return null;
        }

        /**
         * Start one p5 sketch from fetched source.
         *
         * @param {string} source Student sketch source.
         * @param {string} sketchName Filename used for browser source maps.
         */
        function startP5Sketch(source, sketchName) {
          if (!window.p5) {
            showError("p5.js did not load.");
            return;
          }

          try {
            removeExistingCanvases();
            installPrintBridge();
            var instanceSketch = getInstanceModeSketch(source, sketchName);
            if (instanceSketch?.factory) {
              markSketchStarting();
              new window.p5(wrapInstanceFactory(instanceSketch.factory));
            } else if (instanceSketch?.started) {
              // Direct instance-mode sketches already called new p5(...).
            } else {
              postStatus("Running wrapped global-mode p5 sketch.");
              markSketchStarting();
              new window.p5(function (p) {
                createSketchFactory(source, sketchName)(
                  p,
                  window,
                  document,
                  console,
                  window.print,
                );
              });
            }
            setTimeout(installPrintBridge, 0);
          } catch (error) {
            showError(error && error.stack ? error.stack : String(error), error);
          }
        }

        installConsoleBridge();
        installPrintBridge();

        // Surface uncaught student-code errors in the iframe itself; otherwise
        // they can disappear into the browser console while ComfyUI only sees a
        // missing canvas.
        window.addEventListener("error", function (event) {
          showError(event.message || "Error while running p5.js sketch.", event.error);
        });

        // Promise rejections can come from async p5 preload/setup code or from
        // failed fetch/evaluation steps.
        window.addEventListener("unhandledrejection", function (event) {
          showError(
            event.reason && event.reason.stack
              ? event.reason.stack
              : String(event.reason || "Unhandled promise rejection."),
            event.reason,
          );
        });

        // The parent node sends captureCanvas after the iframe loads. Capture
        // happens here, in the same document that owns the canvas, then the PNG
        // Blob is sent back to the matching parent requestId.
        window.addEventListener("message", function (event) {
          var data = event.data || {};
          if (
            data.source !== P5JS_MESSAGE_SOURCE ||
            data.type !== "captureCanvas"
          ) {
            return;
          }

          waitForCanvas(data.timeoutMs || 15000)
            .then(function (canvas) {
              if (!canvas) {
                throw new Error("p5.js sketch did not produce a canvas.");
              }
              postStatus(
                "Capturing p5 canvas:",
                canvas.width + "x" + canvas.height,
              );
              return canvasToPngBlob(canvas);
            })
            .then(function (capture) {
              event.source.postMessage(
                {
                  source: P5JS_MESSAGE_SOURCE,
                  type: "canvasCapture",
                  requestId: data.requestId,
                  ok: true,
                  blob: capture.blob,
                  width: capture.width,
                  height: capture.height,
                },
                event.origin || "*",
              );
            })
            .catch(function (error) {
              event.source.postMessage(
                {
                  source: P5JS_MESSAGE_SOURCE,
                  type: "canvasCapture",
                  requestId: data.requestId,
                  ok: false,
                  error: error && error.stack ? error.stack : String(error),
                },
                event.origin || "*",
              );
            });
        });

        var urlParams = new URLSearchParams(window.location.search);
        var sketchName = urlParams.get("sketch");

        if (sketchName) {
          // Fetch the sketch source as text to avoid Chrome's strict MIME
          // checks against ComfyUI's /view endpoint for uploaded .js files.
          var sketchUrl =
            "/view?filename=" +
            sketchName +
            "&type=temp&subfolder=p5js&rand=" +
            Math.random() +
            Date.now();

          fetch(sketchUrl, { cache: "no-store" })
            .then(function (response) {
              if (!response.ok) {
                throw new Error(
                  "Could not load sketch file: " +
                    sketchName +
                    " (" +
                    response.status +
                    " " +
                    response.statusText +
                    ")",
                );
              }
              return response.text();
            })
            .then(function (source) {
              postStatus(
                "Loaded p5 sketch:",
                sketchName,
                source.length + " chars",
              );
              setTimeout(function () {
                startP5Sketch(source, sketchName);
              }, 0);
            })
            .catch(function (error) {
              showError(error && error.stack ? error.stack : String(error), error);
            });
        }
      })();
    </script>
  </body>
</html>
